name: Tencent Preview Image

on:
  push:
    branches:
      - preview/tencent-20260930
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    env:
      HOP_REF: cbb70e9215a6dc69da8acfd3743e358f7ba4db1d
      IMAGE_NAME: hop-modern-web-preview:20260930
      ASSET_NAME: hop-modern-web-preview-20260930.tar.gz
      RELEASE_TAG: tencent-preview-20260930
    steps:
      - name: Checkout Modern Web
        uses: actions/checkout@v7
        with:
          path: modern

      - name: Checkout pinned Hop
        uses: actions/checkout@v7
        with:
          repository: cxhttt233/hop
          ref: ${{ env.HOP_REF }}
          path: hop

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modern/package-lock.json

      - name: Install pinned Hop P0 runtime modules
        working-directory: hop
        run: |
          ./mvnw -q \
            -pl lib,core,engine,plugins/transforms/checksum,plugins/transforms/concatfields,plugins/transforms/datagrid,plugins/transforms/sql,plugins/transforms/filterrows,plugins/transforms/groupby,plugins/transforms/http,plugins/transforms/insertupdate,plugins/transforms/json,plugins/transforms/mergejoin,plugins/transforms/replacestring,plugins/transforms/rest,plugins/transforms/script,plugins/transforms/selectvalues,plugins/transforms/setvariable,plugins/transforms/streamlookup,plugins/transforms/stringcut,plugins/transforms/tableinput,plugins/transforms/tableoutput,plugins/transforms/uniquerowsbyhashset,plugins/transforms/sort \
            -am -DskipTests install

      - name: Build frontend dist
        working-directory: modern
        env:
          VITE_HOP_PIPELINE_PATH: /workspace/real-graph-proof.hpl
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Build backend and collect runtime classpath
        working-directory: modern
        run: |
          mvn -q -f server/pom.xml -DskipTests package
          rm -rf server/target/preview-lib
          mkdir -p server/target/preview-lib
          mvn -q -f server/pom.xml dependency:copy-dependencies \
            -DincludeScope=test \
            -DoutputDirectory="${{ github.workspace }}/modern/server/target/preview-lib"
          mvn -q -f deploy/preview/runtime-pom.xml dependency:copy-dependencies \
            -DincludeScope=runtime \
            -DoutputDirectory="${{ github.workspace }}/modern/server/target/preview-lib"
          echo "runtime jars: $(find server/target/preview-lib -type f -name '*.jar' | wc -l)"

      - name: Build self-contained preview image
        working-directory: modern
        run: docker build -f deploy/preview/Dockerfile -t "$IMAGE_NAME" .

      - name: Smoke preview image
        run: |
          docker run -d --name hop-modern-preview-smoke -p 18080:80 "$IMAGE_NAME"
          trap 'docker rm -f hop-modern-preview-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/ >/tmp/preview-index.html
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -d '{"path":"/workspace/real-graph-proof.hpl"}' \
            http://127.0.0.1:18080/api/pipelines/open >/tmp/preview-open.json
          grep -q 'real-graph-proof' /tmp/preview-open.json
          docker logs hop-modern-preview-smoke

      - name: Export compressed image
        run: |
          docker save "$IMAGE_NAME" | gzip -1 > "$ASSET_NAME"
          sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
          ls -lh "$ASSET_NAME" "$ASSET_NAME.sha256"

      - name: Publish public preview release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_NAME" "$ASSET_NAME.sha256" \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" \
              --notes "Tencent preview image built from ${{ github.sha }}. Frontend and backend are prebuilt in GitHub Actions; the Tencent host only loads and runs the image."
          else
            gh release create "$RELEASE_TAG" "$ASSET_NAME" "$ASSET_NAME.sha256" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "Hop Modern Web Tencent Preview" \
              --notes "Tencent preview image built from ${{ github.sha }}. Frontend and backend are prebuilt in GitHub Actions; the Tencent host only loads and runs the image."
          fi
